name: Close unapproved pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  check-author:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const allowedAuthors = new Set([
              'WrkX'
              // Add approved GitHub usernames here.
            ]);

            const pullRequest = context.payload.pull_request;
            if (allowedAuthors.has(pullRequest.user.login)) return;

            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number
            };

            await github.rest.issues.createComment({
              ...issue,
              body: 'This repository only accepts pull requests from approved contributors.'
            });

            await github.rest.pulls.update({
              owner: issue.owner,
              repo: issue.repo,
              pull_number: issue.issue_number,
              state: 'closed'
            });
